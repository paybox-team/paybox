<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Box body -->
  <rect x="38" y="90" width="124" height="82" rx="8" fill="url(#boxGrad)" opacity="0.9" filter="url(#glow)"/>

  <!-- Box body inner shadow -->
  <rect x="44" y="96" width="112" height="70" rx="6" fill="#0f172a" opacity="0.5"/>

  <!-- Box lid top face -->
  <rect x="30" y="72" width="140" height="26" rx="6" fill="url(#lidGrad)" filter="url(#glow)"/>

  <!-- Box lid inner -->
  <rect x="38" y="78" width="124" height="14" rx="4" fill="#0f172a" opacity="0.4"/>

  <!-- Lid center strap / ribbon -->
  <rect x="88" y="50" width="24" height="70" rx="4" fill="url(#boxGrad)" opacity="0.85" filter="url(#glow)"/>

  <!-- Ribbon bow left loop -->
  <ellipse cx="80" cy="52" rx="18" ry="10" stroke="url(#lidGrad)" stroke-width="5" fill="none" opacity="0.9" filter="url(#glow)" transform="rotate(-20 80 52)"/>

  <!-- Ribbon bow right loop -->
  <ellipse cx="120" cy="52" rx="18" ry="10" stroke="url(#lidGrad)" stroke-width="5" fill="none" opacity="0.9" filter="url(#glow)" transform="rotate(20 120 52)"/>

  <!-- Dollar / payment symbol -->
  <text x="100" y="148" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="url(#lidGrad)" opacity="0.95" filter="url(#glow)">$</text>
</svg>

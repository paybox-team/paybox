<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100" fill="none">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Box body -->
  <rect x="8" y="38" width="52" height="48" rx="5" fill="url(#boxGrad)" opacity="0.9" filter="url(#glow)"/>
  <!-- Box body inner -->
  <rect x="13" y="43" width="42" height="38" rx="3" fill="#0f172a" opacity="0.45"/>

  <!-- Box lid -->
  <rect x="5" y="28" width="58" height="14" rx="4" fill="url(#lidGrad)" filter="url(#glow)"/>
  <!-- Box lid inner -->
  <rect x="10" y="32" width="48" height="7" rx="2" fill="#0f172a" opacity="0.35"/>

  <!-- Ribbon vertical -->
  <rect x="30" y="14" width="8" height="44" rx="3" fill="url(#boxGrad)" opacity="0.9" filter="url(#glow)"/>

  <!-- Ribbon bow left -->
  <ellipse cx="26" cy="16" rx="10" ry="6" stroke="url(#lidGrad)" stroke-width="3.5" fill="none" opacity="0.95" filter="url(#glow)" transform="rotate(-20 26 16)"/>

  <!-- Ribbon bow right -->
  <ellipse cx="42" cy="16" rx="10" ry="6" stroke="url(#lidGrad)" stroke-width="3.5" fill="none" opacity="0.95" filter="url(#glow)" transform="rotate(20 42 16)"/>

  <!-- Dollar sign -->
  <text x="34" y="74" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="url(#lidGrad)" opacity="0.95" filter="url(#glow)">$</text>

  <!-- PAYBOX wordmark -->
  <text x="76" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="1" fill="url(#boxGrad)" filter="url(#glow)">PAYBOX</text>

  <!-- internet actions tagline -->
  <text x="77" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="3" fill="#818cf8" opacity="0.75">internet actions</text>
</svg>
